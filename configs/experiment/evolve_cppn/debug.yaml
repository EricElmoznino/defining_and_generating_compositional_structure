name: "evolve_cppn_debug"

task:
  _target_: tasks.evolve_cppn.EvolutionaryOptimizationCPPN
  vocab_size: 4
  spatial_shape: [64, 64]
  n_channels: 1
  pop_size: 200
  output_encoding: "quantized_scalar"
  n_workers: 1
  reward_batch_size: 64
  reward_device: "cpu"
  n_logged_examples: 20
  log_examples_every_n_generations: 10
  neat_verbose: true
  reward:
    _target_: rewards.debug.ToyRewardCPPNBranchingNetwork
    vocab_size: ${..vocab_size}
    spatial_shape: ${..spatial_shape}
    n_channels: ${..n_channels}
    terminal_gates_per_side: 5
    path_density_target: 0.14
    max_path_density: 0.34
    approach_radius_fraction: 0.22
    coverage_grid_size: 6
  neat_config_overrides:
    NEAT:
      fitness_threshold: 1e9
    DefaultGenome:
      activation_default: "tanh"
      activation_options: "identity sigmoid tanh sin gauss silu"
      activation_mutate_rate: 0.12
      initial_connection: "full_direct"
      conn_add_prob: 0.35
      conn_delete_prob: 0.08
      node_add_prob: 0.25
      node_delete_prob: 0.05
      weight_mutate_power: 0.75
      bias_mutate_power: 0.75
    DefaultSpeciesSet:
      compatibility_threshold: 2.8
    DefaultStagnation:
      max_stagnation: 30
      species_elitism: 3
    DefaultReproduction:
      elitism: 2
      survival_threshold: 0.25

n_generations: 1000
